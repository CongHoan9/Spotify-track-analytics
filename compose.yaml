services:
  app:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql+psycopg://music:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/music
      MODEL_DIR: ${MODEL_DIR:-artifacts/baseline}
    volumes: ["./artifacts:/app/artifacts:ro"]
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: music
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: music
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music -d music"]
      interval: 5s
      timeout: 3s
      retries: 10
  kafka:
    image: apache/kafka:3.9.0
    profiles: ["streaming"]
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes: ["kafka-data:/tmp/kraft-combined-logs"]
  outbox:
    build: .
    profiles: ["streaming"]
    command: ["python", "-m", "pipelines.outbox"]
    restart: on-failure
    environment:
      DATABASE_URL: postgresql+psycopg://music:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/music
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
      app:
        condition: service_started
volumes:
  postgres-data:
  kafka-data:
