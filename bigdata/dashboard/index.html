<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spotify · Spark Analytics</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c1321;color:#e7edf8;font:15px system-ui}main{max-width:1280px;margin:auto;padding:36px}h1{font-size:38px;margin:8px 0}h2{font-size:21px}p,small{color:#9cacc3;line-height:1.7}.tag{color:#b3fa83;letter-spacing:3px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{background:#152135;border:1px solid #2a3950;border-radius:16px;padding:24px;margin:20px 0;overflow:auto}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.metric{padding:22px;background:#1a2c3a;border-radius:12px}.value{font-size:30px;color:#b3fa83;font-weight:700}.bar{display:grid;grid-template-columns:110px 1fr 50px;gap:10px;align-items:center;font-size:12px;margin:9px 0}.fill{height:15px;border-radius:3px;background:#99dc79}.track{height:15px;background:#23364b}table{border-collapse:collapse;width:100%;font-size:12px}td,th{border-bottom:1px solid #34455b;padding:9px;text-align:left}.heat td{text-align:center;min-width:48px;color:#fff}.heat th{font-size:10px;max-width:75px;overflow-wrap:anywhere}a{color:#b3fa83}button,select{padding:10px;background:#253b51;border:1px solid #526278;color:white;border-radius:7px}svg{width:100%;height:auto}code{overflow-wrap:anywhere}details{margin:20px 0}#status{color:#b3fa83}@media(max-width:800px){.grid{display:block}.metrics{grid-template-columns:repeat(2,1fr)}main{padding:16px}}
</style><main><div class="tag">APACHE SPARK · SPOTIFY TRACKS</div><h1>Phân tích dữ liệu âm nhạc</h1><p>Danh mục · Chất lượng dữ liệu · Spark SQL · Phân cụm · Hiệu năng</p><button onclick="location.reload()">Nạp kết quả mới</button> <a href="http://localhost:8080" target="_blank">Spark Master UI ↗</a><p id="status">Đang đọc kết quả…</p><div id="body"></div></main>
<script>
const el=(tag,text)=>{let e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e;};
const num=x=>typeof x==='number'?x.toLocaleString('vi-VN',{maximumFractionDigits:3}):String(x);
function card(title){let e=el('section');e.className='card';e.append(el('h2',title));return e;}
function table(rows,columns){let t=el('table'),head=el('tr');columns.forEach(c=>head.append(el('th',c)));t.append(head);rows.forEach(r=>{let tr=el('tr');columns.forEach(c=>tr.append(el('td',num(r[c]))));t.append(tr)});return t;}
function bars(rows,label,value){let e=el('div'),max=Math.max(...rows.map(r=>r[value]));for(let r of rows){let row=el('div');row.className='bar';let track=el('div');track.className='track';let f=el('div');f.className='fill';f.style.width=(100*r[value]/max)+'%';track.append(f);row.append(el('span',r[label]),track,el('span',num(r[value])));e.append(row)}return e;}
fetch('results/summary.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Chưa có kết quả. Chạy pipeline theo BIGDATA.md rồi bấm Nạp kết quả mới.');return r.json()}).then(d=>{
let root=document.getElementById('body'),r=d.run;document.getElementById('status').textContent='Run '+r.run_utc+' · Spark '+r.spark_version+' · '+r.master;
let metrics=el('div');metrics.className='metrics';for(let [label,v] of [['Dòng đầu vào',r.raw_rows],['Bài duy nhất hợp lệ',r.unique_tracks],['Thể loại',r.genres],['Silhouette test',d.model_selection.test_silhouette]]){let c=el('div');c.className='metric';let n=el('div',num(v));n.className='value';c.append(n,el('small',label));metrics.append(c)}root.append(metrics);
let quality=card('01 · Chất lượng dữ liệu');quality.append(el('p',`${r.invalid_rows} dòng không hợp lệ bị loại; ${r.duplicate_track_rows} dòng lặp track được gộp. Quan hệ nhiều thể loại được giữ riêng. Không coi số dòng CSV là số bài duy nhất.`));quality.append(table(Object.entries(r.missing_values).map(([column,missing])=>({column,missing})),['column','missing']));root.append(quality);
let grid=el('div');grid.className='grid';let g=card('02 · Top 15 genre theo popularity trung bình');g.append(bars(d.genre_stats.slice(0,15),'track_genre','avg_popularity'),el('small','Popularity tại snapshot; không phải xu hướng nghe hiện tại.'));grid.append(g);let a=card('03 · Nghệ sĩ có nhiều bài trong mẫu');a.append(bars(d.artist_stats.slice(0,15),'artist','tracks'),el('small','Tách nghệ sĩ cộng tác bằng dấu ; và đếm track phân biệt.'));grid.append(a);root.append(grid);
grid=el('div');grid.className='grid';let duration=card('04 · Phân bố thời lượng');duration.append(bars(d.duration_distribution,'duration_group','tracks'));grid.append(duration);let pop=card('05 · Phân bố popularity');pop.append(bars(d.popularity_distribution,'popularity_bin','tracks'));grid.append(pop);root.append(grid);
let corr=card('06 · Tương quan Pearson');let heat=el('table');heat.className='heat';let h=el('tr');h.append(el('th',''));d.correlation.features.forEach(c=>h.append(el('th',c)));heat.append(h);d.correlation.matrix.forEach((row,i)=>{let tr=el('tr');tr.append(el('th',d.correlation.features[i]));row.forEach(v=>{let td=el('td',v.toFixed(2));td.style.background=`rgba(${v>=0?'70,150,100':'180,70,100'},${Math.abs(v)*.8})`;tr.append(td)});heat.append(tr)});corr.append(heat,el('p','Tương quan không chứng minh quan hệ nhân quả.'));root.append(corr);
let clusters=card('07 · Chọn mô hình và phân tích cụm');let selection=d.model_selection;clusters.append(el('p',`Chia theo mã bài: train ${num(selection.split_rows.train)}, validation ${num(selection.split_rows.validation)}, test ${num(selection.split_rows.test)}. Scaler chỉ fit trên train; chọn k bằng validation. Test giữ riêng đến khi chọn xong.`));clusters.append(table(selection.trials,['k','validation_silhouette','train_cost','iterations']));clusters.append(el('p',`Chọn k=${r.k}; silhouette test=${num(selection.test_silhouette)}. Refit toàn bộ danh mục cho bảng dưới; silhouette mô tả=${num(r.silhouette_squared_euclidean)}. Hai phép đánh giá đều dùng Euclidean bình phương. Nhãn cụm không phải genre hay accuracy.`));clusters.append(table(d.cluster_profiles,['prediction','tracks','energy','valence','danceability','tempo','popularity']));
let svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 600 340');let colors=['#aff27a','#fca67e','#8dbafa','#e5a6f6','#f5e481','#7ce1d8','#ff8fa0','#b7a1fa'];d.scatter.forEach(p=>{let c=document.createElementNS(svg.namespaceURI,'circle');c.setAttribute('cx',40+p.energy*520);c.setAttribute('cy',300-p.valence*270);c.setAttribute('r','3');c.setAttribute('fill',colors[p.prediction%colors.length]);c.setAttribute('opacity','.65');svg.append(c)});clusters.append(svg,el('small','Trục ngang: energy; trục dọc: valence. 500 bài chọn theo hash để minh họa; mô hình dùng toàn bộ 10 chiều.'));root.append(clusters);
let bench=card('08 · Benchmark thực đo');bench.append(el('p',`${r.benchmark_rows.toLocaleString()} dòng; hệ số nhân tải ${r.scale_factor}. Warm-up mỗi cấu hình, sau đó ba vòng đo với thứ tự xáo trộn. AQE tắt trong benchmark; hash partition theo artists. Container chia sẻ một máy; không suy ra speedup nhiều máy.`),table(d.benchmark_design.summary,['partitions','median_seconds','min_seconds','max_seconds']),el('h3','Từng lần đo theo thứ tự thực thi'),table(r.benchmark,['partitions','repeat','seconds','checksum']));root.append(bench);
let meta=card('09 · Bằng chứng và tải kết quả');meta.append(el('p','Application ID: '+r.application_id+' · Executor hoạt động: '+r.active_executors),el('code','SHA256: '+r.dataset_sha256));let history=el('a','Xem Jobs / Stages trong Spark History ↗');history.href='http://localhost:18080/history/'+r.application_id+'/jobs/';history.target='_blank';meta.append(el('p'),history);for(let name of ['BAO_CAO_BIGDATA.md','run.json','summary.json','model-selection.json','queries.sql','query-plans.txt','genre_stats.csv','cluster_profiles.csv']){let p=el('p'),link=el('a',name);link.href='results/'+name;link.download=name;p.append(link);meta.append(p)}root.append(meta);
}).catch(e=>document.getElementById('status').textContent=e.message);
</script></html>
